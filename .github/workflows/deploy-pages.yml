name: Deploy GitHub Pages

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test & build production (main) into dist/
        run: |
          npm test
          npm run build

      - name: Build dev branch into dist/dev/ if present
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git worktree add ../dev-wt origin/dev
            (cd ../dev-wt && npm test && npm run build)
            mkdir -p dist/dev
            cp -a ../dev-wt/dist/. dist/dev/
          fi

      - name: Verify public dist boundary
        run: |
          test -f dist/index.html
          test -f dist/project.html
          test -f dist/.nojekyll
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            test -f dist/dev/index.html
            test -f dist/dev/project.html
          fi
          if find dist -iname "*private*" -o -iname "*Schema centrale*" | grep -q .; then
            echo "Private reference detected in dist/"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
