<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" class="vector-map scene" data-diagram="cycle" viewBox="0 0 1160 540" role="group" aria-label="From groundwater to comfort at home"><style>
.vector-map{display:block;width:100%;height:100%;overflow:visible;user-select:none}
.svg-label{fill:#242424;font-family:"Segoe UI",Aptos,Calibri,-apple-system,BlinkMacSystemFont,sans-serif;pointer-events:none}
.svg-title{font-weight:700;fill:#242424}
.svg-sub{fill:#5c5c5c;font-weight:500}
.svg-temp{font-family:Consolas,"Courier New",monospace;font-weight:700;fill:#242424}
.zone-box{fill:#f5f5f5;fill-opacity:.55;stroke:#dedede;stroke-width:1.5;stroke-dasharray:5 5}
.zone-caption{fill:#5c5c5c;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;pointer-events:none}
.machine-card{fill:#ffffff;stroke:#919191;stroke-width:2;transition:stroke .16s ease,stroke-width .16s ease}
.machine-sub{fill:#fcfbf8;stroke:#919191;stroke-width:1.6}
.plate-pack{fill:#f5f5f5;stroke:#919191;stroke-width:2}
.aquifer-fill{fill:#0078d4;fill-opacity:.1;stroke:#0078d4;stroke-width:1.5;stroke-dasharray:6 4}
.pipe-casing{fill:none;stroke:#919191;stroke-width:9.5;stroke-linecap:round;stroke-linejoin:round;opacity:.42}
.pipe-core{fill:none;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.pipe-core.thin{stroke-width:4.2}
.pipe-casing.thin{stroke-width:7.4}
.pipe-sheen{fill:none;stroke:rgba(255, 255, 255, 0.55);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.thermal-track{fill:none;stroke:#f59e0b;stroke-width:3;stroke-dasharray:6 5;stroke-linecap:round;opacity:.85}
.power-track{fill:none;stroke:#b11f4b;stroke-width:3.2;stroke-linecap:round}
.hydraulic-node{cursor:pointer;outline:none}
.hydraulic-node:hover .machine-card,.hydraulic-node:focus-visible .machine-card,.hydraulic-node.highlighted .machine-card{stroke:#b11f4b;stroke-width:3.4}
.hydraulic-node:hover .tag-pill-bg,.hydraulic-node:focus-visible .tag-pill-bg,.hydraulic-node.highlighted .tag-pill-bg{fill:#b11f4b;stroke:#b11f4b}
.hydraulic-node:hover .tag-pill-text,.hydraulic-node:focus-visible .tag-pill-text,.hydraulic-node.highlighted .tag-pill-text{fill:#ffffff}
.tag-pill-bg{fill:rgba(177, 31, 75, 0.08);stroke:#b11f4b;stroke-width:1.4;transition:fill .15s ease}
.tag-pill-text{fill:#b11f4b;font-family:Consolas,"Courier New",monospace;font-weight:700;pointer-events:none}
.inline-pump{cursor:pointer}
.inline-pump:hover circle,.inline-pump:focus-visible circle,.inline-pump.highlighted circle{stroke:#b11f4b;stroke-width:3}
.port{pointer-events:none}
.flow-layer{pointer-events:none}
@media(max-width:1023px),(max-height:540px){.pc-detail{display:none}}
