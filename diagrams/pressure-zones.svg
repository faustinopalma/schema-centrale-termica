    <text x="446" y="209" font-size="14" fill="#5c5c5c">Communal-space branch</text><text x="446" y="231" font-size="14" fill="#5c5c5c">3 m3/h; 200 kPa</text></g><g id="pressure-zones-zone-common" class="diagram-node" data-node="zone-common">
