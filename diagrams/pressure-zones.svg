<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1260" height="1000" viewBox="0 0 1260 1000" role="img" aria-labelledby="pressure-zones-title pressure-zones-desc">
  <title id="pressure-zones-title">Heating and cooling: distribution by pressure zone</title><desc id="pressure-zones-desc">Paired arrows summarise supply and return | SC2 transfers heat across a separate pressure circuit. P07/P09 residential outlets: 42/38 deg C winter and 13/18 deg C summer (pipe labels). S00 p.1, right-hand distribution. SC2 schedule and terminal details contain different selection temperatures. Mixing valves, expansion vessels, make-up groups and protection devices are omitted from this functional view.</desc>
  <defs><marker id="pressure-zones-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b11f4b"/></marker><marker id="pressure-zones-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0078d4"/></marker><marker id="pressure-zones-success" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker><marker id="pressure-zones-warning" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/></marker></defs>
  <g font-family="Segoe UI, Arial, sans-serif">
