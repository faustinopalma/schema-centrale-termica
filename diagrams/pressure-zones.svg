    <text x="800" y="378" text-anchor="middle" font-size="15" fill="#5c5c5c">Supply / return</text></g><g class="diagram-edge" data-edge="branch-primary">
    <path id="pressure-zones-branch-primary" d="M260,430 L330,430 L330,625 L430,625" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"  marker-end="url(#pressure-zones-success)" marker-start="url(#pressure-zones-success)"/>
