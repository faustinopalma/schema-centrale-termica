    <text x="966" y="376" font-size="16" font-weight="700" fill="#242424">TOWERS A + B | BP</text>
    <text x="966" y="404" font-size="14" fill="#5c5c5c">Low-pressure residential outlets</text><text x="966" y="426" font-size="14" fill="#5c5c5c">Apartment modules downstream</text></g><g id="pressure-zones-zone-p08" class="diagram-node" data-node="zone-p08">
    <rect x="430" y="570" width="210" height="110" rx="12" fill="#ffffff" stroke="#dedede" stroke-width="2"/>
    <rect x="430" y="584" width="5" height="82" rx="2" fill="#16a34a"/>
    <text x="446" y="601" font-size="16" font-weight="700" fill="#242424">P08</text>
    <text x="446" y="629" font-size="14" fill="#5c5c5c">SC2 primary circulation</text><text x="446" y="651" font-size="14" fill="#5c5c5c">41.2 m3/h; 80 kPa</text></g><g id="pressure-zones-zone-sc2" class="diagram-node" data-node="zone-sc2">
    <rect x="730" y="570" width="170" height="110" rx="12" fill="#ffffff" stroke="#dedede" stroke-width="2"/>
    <rect x="730" y="584" width="5" height="82" rx="2" fill="#b11f4b"/>
    <text x="746" y="601" font-size="16" font-weight="700" fill="#242424">SC2</text>
    <text x="746" y="629" font-size="14" fill="#5c5c5c">Hydraulic boundary</text><text x="746" y="651" font-size="14" fill="#5c5c5c">Heat crosses plates</text></g><g id="pressure-zones-zone-p09" class="diagram-node" data-node="zone-p09">
    <rect x="990" y="570" width="210" height="110" rx="12" fill="#ffffff" stroke="#dedede" stroke-width="2"/>
    <rect x="990" y="584" width="5" height="82" rx="2" fill="#16a34a"/>
