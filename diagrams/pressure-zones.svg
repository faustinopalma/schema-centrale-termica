    <text x="40" y="923" fill="#5c5c5c" font-size="15">P07/P09 residential outlets: 42/38 deg C winter and 13/18 deg C summer (pipe labels).</text><text x="40" y="948" fill="#5c5c5c" font-size="15">S00 p.1, right-hand distribution. SC2 schedule and terminal details contain different selection temperatures.</text><text x="40" y="973" fill="#5c5c5c" font-size="15">Mixing valves, expansion vessels, make-up groups and protection devices are omitted from this functional view.</text>
