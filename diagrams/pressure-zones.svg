    </g><g class="diagram-edge" data-edge="common-load">
    <path id="pressure-zones-common-load" d="M650,205 L950,205" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"  marker-end="url(#pressure-zones-success)" marker-start="url(#pressure-zones-success)"/>
    <text x="800" y="183" text-anchor="middle" font-size="15" fill="#5c5c5c">Supply / return</text></g><g class="diagram-edge" data-edge="branch-low">
